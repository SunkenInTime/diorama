<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Diorama web map</title>
<style>
	:root {
		--bg: #15171c;
		--panel: rgba(20, 22, 27, 0.82);
		--text: #e8eaee;
		--muted: #a3a9b4;
		--line: rgba(255, 255, 255, 0.12);
	}
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
		font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
	#map { touch-action: none; cursor: grab; }
	#map.dragging { cursor: grabbing; }
	#clouds { pointer-events: none; }
	.bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; pointer-events: none; flex-wrap: wrap; }
	.bar > * { pointer-events: auto; }
	.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(6px); }
	.zoom { position: fixed; right: 12px; bottom: 12px; display: flex; flex-direction: column; overflow: hidden; }
	button { appearance: none; background: none; border: 0; color: var(--text); font: inherit; cursor: pointer; }
	.zoom button { width: 40px; height: 40px; font-size: 20px; }
	.zoom button + button { border-top: 1px solid var(--line); }
	.dims { display: flex; overflow: hidden; }
	.dims button { padding: 8px 12px; color: var(--muted); }
	.dims button.on { color: var(--text); background: rgba(255, 255, 255, 0.08); }
	.dims button + button { border-left: 1px solid var(--line); }
	.where { position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
	.empty { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); padding: 24px; text-align: center; }
	button:focus-visible { outline: 2px solid #7aa7ff; outline-offset: -2px; }
</style>
</head>
<body>
<canvas id="clouds" aria-hidden="true"></canvas>
<canvas id="map" aria-label="Map"></canvas>
<div class="bar"><div class="dims panel" id="dims"></div></div>
<div class="zoom panel"><button id="in" aria-label="Zoom in">+</button><button id="out" aria-label="Zoom out">&minus;</button></div>
<div class="where panel" id="where" hidden></div>
<div class="empty" id="empty">The map is still being drawn. It fills in as the server draws it.</div>
<script>
"use strict";
// Behind a proxy at a folder of its own (example.com/map), the page's files are inside that folder.
if (!location.pathname.endsWith("/") && !/\.[a-z]+$/i.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let map = null;          // map.json
let dim = null;          // the dimension shown
let present = [];        // per zoom, a Map of "u,v" -> the tile's version
// The view: the map point at the middle of the screen, in map units (a block across), and how many CSS pixels a unit takes.
let view = { u: 0, v: 0, scale: 1 };

function tileUnits(z) { return map.tileUnits * (1 << z); }

function load(first) {
	fetch("map.json", { cache: "no-cache" }).then(r => r.json()).then(json => {
		map = json;
		const wanted = dim ? dim.id : (parseHash().dim || "minecraft:overworld");
		pick(map.dimensions.find(d => d.id === wanted) || map.dimensions[0], first);
		buildDims();
	}).catch(() => {}).finally(() => setTimeout(() => load(false), 30000));
}

function pick(d, first) {
	const switched = !dim || !d || dim.id !== d.id;
	dim = d || null;
	// Each tile with its version (when it was last drawn), so a browser keeps a picture until it changes.
	present = dim ? dim.tiles.map(list => {
		const m = new Map();
		const step = dim.versions ? 3 : 2;
		for (let i = 0; i < list.length; i += step) m.set(list[i] + "," + list[i + 1], step === 3 ? list[i + 2] : map.updated);
		return m;
	}) : [];
	document.getElementById("empty").style.display = dim && present[0] && present[0].size ? "none" : "flex";
	// A new tile list can take land away as well as add it: the clouds work out their field again.
	if (switched) clouds.reset(); else clouds.changed();
	if (first || switched) home(first);
	draw();
}

function home(first) {
	const h = first ? parseHash() : {};
	// The world is 60 million blocks across; a view past that is a broken link.
	if (h.u !== undefined && isFinite(h.u) && isFinite(h.v) && isFinite(h.scale) && h.scale > 0 && Math.abs(h.u) < 1e8 && Math.abs(h.v) < 1e8) {
		const lim = limits();
		view = { u: h.u, v: h.v, scale: Math.max(lim.min, Math.min(lim.max, h.scale)) };
		return;
	}
	// Start where most of the land is: the median drawn tile, which a few far-off places (a trip to
	// the world border) can't pull away the way they pull an average.
	const us = [], vs = [];
	if (present[0]) for (const k of present[0].keys()) { const [u, v] = k.split(",").map(Number); us.push(u); vs.push(v); }
	const median = list => { list.sort((a, b) => a - b); return list[list.length >> 1]; };
	view.u = us.length ? (median(us) + 0.5) * map.tileUnits : 0;
	view.v = vs.length ? (median(vs) + 0.5) * map.tileUnits : 0;
	view.scale = 1;
}

function buildDims() {
	const box = document.getElementById("dims");
	box.innerHTML = "";
	box.style.display = map.dimensions.length > 1 ? "flex" : "none";
	for (const d of map.dimensions) {
		const b = document.createElement("button");
		b.textContent = nameOf(d.id);
		b.className = dim && d.id === dim.id ? "on" : "";
		b.onclick = () => { pick(d, false); buildDims(); saveHash(); };
		box.appendChild(b);
	}
}

function nameOf(id) {
	const known = { "minecraft:overworld": "Overworld", "minecraft:the_nether": "Nether", "minecraft:the_end": "End" };
	if (known[id]) return known[id];
	const path = id.split(":").pop().replace(/_/g, " ");
	return path.charAt(0).toUpperCase() + path.slice(1);
}

function zoomFor(scale) {
	// The coarsest level still about as sharp as the screen. A tile pixel may cover up to one and a
	// half screen pixels: on a phone's dense screen, a quarter of the pictures to fetch for a look
	// that's hardly softer.
	const native = map.tilePixels / map.tileUnits; // CSS px per unit at zoom 0, 1:1
	let z = Math.floor(Math.log2(native * 1.5 / (scale * (devicePixelRatio || 1))));
	return Math.max(0, Math.min(dim.zoomLevels - 1, z));
}

// Tiles: fetched a few at a time, the ones the view needs most first, and fetched again if they
// fail. A browser opening a page asks for every picture at once; on a slow link that queues the
// ones in the middle of the screen behind ones it has already panned away from.
const MAX_LOADING = 6;
// key "z/u_v" -> { img, state: "loading" | "preparing" | "ready" | "failed", retry, tries, ver, old }:
// old is the picture from before a redraw, shown until the new one is ready.
const tiles = new Map();
let loading = 0;
let wantedList = [];      // keys of the tiles the view wants, most wanted first, as of the last paint

function tileKey(z, u, v) { return dim.folder + "/" + z + "/" + u + "_" + v; }

function tile(z, u, v) {
	const t = tiles.get(tileKey(z, u, v));
	return !t ? null : t.state === "ready" ? t.img : t.old || null;
}

function forget(key, t) {
	tiles.delete(key);
	clouds.forget(key);
	for (const img of [t.img, t.old]) if (img && img.close) img.close();
}

function startLoads() {
	const now = performance.now();
	const wanted = new Set(wantedList);
	// Pictures no longer on screen stop downloading, so the ones now wanted go first.
	for (const [key, t] of tiles) {
		if (t.state === "loading" && !wanted.has(key)) {
			t.img.onload = t.img.onerror = null;
			t.img.src = "";
			loading--;
			forget(key, t);
		}
	}
	for (const key of wantedList) {
		if (loading >= MAX_LOADING) break;
		const parts = key.split("/"), z = parts[parts.length - 2];
		const [u, v] = parts[parts.length - 1].split("_");
		const ver = present[+z] && present[+z].get(u + "," + v);
		let t = tiles.get(key);
		// Already here and current, on its way, or waiting to try again. A picture the server has
		// drawn again since (a newer version in map.json) is fetched again, the old one shown meanwhile.
		if (t && (t.state === "loading" || t.state === "preparing" || (t.state === "failed" && t.retry > now) || (t.state === "ready" && t.ver === ver))) continue;
		const img = new Image();
		const old = !t ? null : t.state === "ready" ? t.img : t.old;
		t = { img, state: "loading", tries: t && t.state === "failed" ? t.tries : 0, ver, old };
		tiles.set(key, t);
		loading++;
		img.onload = () => {
			loading--;
			t.state = "preparing";
			clouds.prepare(key, img).then(picture => {
				if (tiles.get(key) !== t) { if (picture.close) picture.close(); return; }
				if (t.old && t.old.close) t.old.close();
				t.img = picture; t.old = null; t.state = "ready";
				draw();
			});
			draw();
		};
		img.onerror = () => {
			// A server or proxy too busy for a moment: again shortly, later and later.
			t.state = "failed"; loading--; t.tries++;
			t.retry = performance.now() + Math.min(30000, 500 * Math.pow(2, t.tries));
			setTimeout(draw, Math.min(30000, 500 * Math.pow(2, t.tries)) + 10);
			draw();
		};
		img.src = key + ".jpg?v=" + ver;
	}
	// Keep memory in hand: forget ready pictures far from anything wanted once there are many.
	if (tiles.size > 600) {
		for (const [key, t] of tiles) {
			if (tiles.size <= 400) break;
			if (t.state !== "loading" && t.state !== "preparing" && !wanted.has(key)) forget(key, t);
		}
	}
}

let pending = false;
function draw() {
	if (pending) return;
	pending = true;
	requestAnimationFrame(() => { pending = false; paint(); });
}

/** The tiles at a level that touch the view, nearest its middle first. */
function visible(level, left, top, w, h) {
	const units = tileUnits(level);
	const u0 = Math.floor(left / units), u1 = Math.floor((left + w / view.scale) / units);
	const v0 = Math.floor(top / units), v1 = Math.floor((top + h / view.scale) / units);
	const cu = (view.u / units) - 0.5, cv = (view.v / units) - 0.5;
	const out = [];
	for (let v = v0; v <= v1; v++) for (let u = u0; u <= u1; u++) {
		if (present[level] && present[level].has(u + "," + v)) out.push([u, v, (u - cu) * (u - cu) + (v - cv) * (v - cv)]);
	}
	out.sort((a, b) => a[2] - b[2]);
	return out;
}

let fillState = { wanted: 0, loaded: 0, any: 0 };
window.__fill = () => fillState;

function paint() {
	const w = canvas.clientWidth, h = canvas.clientHeight, dpr = devicePixelRatio || 1;
	if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
		canvas.width = Math.round(w * dpr);
		canvas.height = Math.round(h * dpr);
	}
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.clearRect(0, 0, canvas.width, canvas.height);
	if (!map || !dim) return;
	const z = zoomFor(view.scale);
	const left = view.u - w / 2 / view.scale, top = view.v - h / 2 / view.scale;
	// Two levels coarser first: a handful of pictures fill the screen at once, blurred, while the
	// sharp ones come in from the middle out. Then the next view out of the screen's edges, last.
	const coarse = Math.min(dim.zoomLevels - 1, z + 2);
	const sharp = visible(z, left, top, w, h);
	const list = [];
	if (coarse > z) for (const [u, v] of visible(coarse, left, top, w, h)) list.push(tileKey(coarse, u, v));
	for (const [u, v] of sharp) list.push(tileKey(z, u, v));
	const margin = tileUnits(z) * view.scale;
	for (const [u, v] of visible(z, left - margin / view.scale, top - margin / view.scale, w + 2 * margin, h + 2 * margin)) {
		const key = tileKey(z, u, v);
		if (!list.includes(key)) list.push(key);
	}
	wantedList = list;
	startLoads();

	// Where each picture goes on screen, and which are in, finest level first: a coarser picture is
	// drawn only where no finer one is, or its land would show through the finer one's unexplored
	// (see-through) parts as a blurred rim.
	const k = view.scale * dpr;
	const sx = m => Math.round((m - left) * k), sy = m => Math.round((m - top) * k);
	const rect = (level, u, v) => {
		const units = tileUnits(level), x0 = sx(u * units), y0 = sy(v * units);
		return [x0, y0, sx((u + 1) * units) - x0, sy((v + 1) * units) - y0];
	};
	const drawn = [];
	for (let level = z; level <= coarse; level++) {
		const list = [];
		for (const [u, v] of level === z ? sharp : visible(level, left, top, w, h)) {
			const img = tile(level, u, v);
			if (img) list.push([img, rect(level, u, v)]);
		}
		drawn.push(list);
	}
	let loaded = drawn[0].length, any = 0;
	for (let i = drawn.length - 1; i >= 0; i--) {
		// Sharp pixels once a block takes more screen than the picture has for it.
		ctx.imageSmoothingEnabled = k < map.tilePixels / map.tileUnits / (1 << (z + i));
		for (const [img, r] of drawn[i]) {
			any++;
			const finer = [];
			for (let j = 0; j < i; j++) for (const [, f] of drawn[j]) if (f[0] < r[0] + r[2] && f[0] + f[2] > r[0] && f[1] < r[1] + r[3] && f[1] + f[3] > r[1]) finer.push(f);
			if (finer.length) {
				// One clip per finer picture: clips add up as an intersection, so this leaves out where
				// any of them is (one path with them all would put back where two overlap).
				ctx.save();
				for (const f of finer) {
					ctx.beginPath();
					ctx.rect(r[0], r[1], r[2], r[3]);
					ctx.rect(f[0], f[1], f[2], f[3]);
					ctx.clip("evenodd");
				}
			}
			ctx.drawImage(img, r[0], r[1], r[2], r[3]);
			if (finer.length) ctx.restore();
		}
	}
	fillState = { wanted: sharp.length, loaded, any };
	clouds.paint(left, top, w, h, z);
}

// The clouds over land nobody has explored, as the game draws them (ExportFog.paintClouds and
// VanillaClouds.code): Minecraft's cloud pattern in cells about 40 pixels across, three layers
// stacked like terraces, thinner near explored land, the cells growing as the map zooms out.
// WebGL 2, drawn at a lower resolution than the map and under it: each picture is see-through
// where nobody explored, so explored land always shows clear. Without WebGL 2, no clouds.
const clouds = (() => {
	const CELL = 12.8, REPEAT = 256, LARGEST = 4, RAMP = 112, CLOUD_PIXELS = 40;
	const MIDDLE_U = 37, MIDDLE_V = 151, TOP_U = 97, TOP_V = 41;
	const glCanvas = document.getElementById("clouds");
	const gl = glCanvas.getContext("webgl2", { premultipliedAlpha: true, alpha: true, antialias: false });
	const coverage = new Map(); // tile key -> Uint8Array(TILE_MASK squared), how much of each part of a loaded tile has land
	let pattern = null;         // { middle: Float32Array[5], top: Float32Array[5] }
	let noise = null;           // Uint8Array(256 * 256), FogTextures' red channel
	let program = null, tex = {}, uni = {};
	let field = null;           // the known mask, distances and codes for the region around the view
	let dirty = true, fieldTimer = 0;
	const TILE_MASK = 64; // a tile's land read at 64 by 64, as the game keeps its coverage
	// #...&clouds=0 in the address shows the map without them.
	const off = new URLSearchParams(location.hash.slice(1)).get("clouds") === "0";

	function hash(x) { const s = Math.sin(x) * 43758.5453; return s - Math.floor(s); }
	function mod(a, n) { return ((a % n) + n) % n; }
	function smoothstep(a, b, x) { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

	// java.util.Random, for FogTextures' noise exactly as the game makes it.
	function javaRandom(seed) {
		let s = (BigInt(seed) ^ 0x5DEECE66Dn) & ((1n << 48n) - 1n);
		return () => {
			s = (s * 0x5DEECE66Dn + 0xBn) & ((1n << 48n) - 1n);
			return Number(s >> 24n) / (1 << 24);
		};
	}
	function valueNoise(size, cells, seed) {
		const rnd = javaRandom(seed), lat = new Float32Array(cells * cells);
		for (let i = 0; i < lat.length; i++) lat[i] = Math.fround(rnd());
		const out = new Float32Array(size * size), sm = t => t * t * t * (t * (t * 6 - 15) + 10);
		for (let y = 0; y < size; y++) {
			const fy = y * cells / size, y0 = Math.floor(fy), ty = sm(fy - y0);
			for (let x = 0; x < size; x++) {
				const fx = x * cells / size, x0 = Math.floor(fx), tx = sm(fx - x0);
				const a = lat[(y0 % cells) * cells + x0 % cells], b = lat[(y0 % cells) * cells + (x0 + 1) % cells];
				const c = lat[((y0 + 1) % cells) * cells + x0 % cells], d = lat[((y0 + 1) % cells) * cells + (x0 + 1) % cells];
				const top = a + (b - a) * tx, bottom = c + (d - c) * tx;
				out[y * size + x] = top + (bottom - top) * ty;
			}
		}
		return out;
	}
	function makeNoise() {
		const a = valueNoise(256, 6, 1), b = valueNoise(256, 12, 31 + 7), out = new Uint8Array(256 * 256);
		for (let i = 0; i < out.length; i++) out[i] = Math.round((a[i] * 0.7 + b[i] * 0.3) * 255);
		return out;
	}

	// VanillaClouds.order: each cell's place in the order a layer fills in, at each size.
	function order(texBits, level, finer, ou, ov) {
		const period = REPEAT >> level, score = new Float64Array(period * period);
		const cloud = (u, v) => texBits[mod(v, 256) * 256 + mod(u, 256)];
		if (!finer) {
			const reach = 3, side = 7, weights = [];
			let total = 0;
			for (let dj = -reach; dj <= reach; dj++) for (let di = -reach; di <= reach; di++) { const wgt = Math.exp(-(di * di + dj * dj) / (2 * 1.2 * 1.2)); weights.push(wgt); total += wgt; }
			for (let k = 0; k < weights.length; k++) weights[k] /= total;
			for (let j = 0; j < period; j++) for (let i = 0; i < period; i++) {
				let near = 0;
				for (let dj = -reach; dj <= reach; dj++) for (let di = -reach; di <= reach; di++) {
					if (cloud(mod(i + di, period) + ou, mod(j + dj, period) + ov)) near += weights[(dj + reach) * side + di + reach];
				}
				const h = hash(i * 127.1 + j * 311.7 + ou * 74.7);
				score[j * period + i] = cloud(i + ou, j + ov) ? -1 + 0.01 * h : -near + 0.25 * (h - 0.5);
			}
		} else {
			const fp = period * 2;
			for (let j = 0; j < period; j++) for (let i = 0; i < period; i++) {
				score[j * period + i] = finer[2 * j * fp + 2 * i] + finer[2 * j * fp + 2 * i + 1] + finer[(2 * j + 1) * fp + 2 * i] + finer[(2 * j + 1) * fp + 2 * i + 1];
			}
		}
		const index = Array.from(score, (_, n) => n);
		index.sort((a, b) => score[a] - score[b]);
		const ranked = new Float32Array(score.length);
		for (let n = 0; n < index.length; n++) ranked[index[n]] = (n + 0.5) / index.length;
		return ranked;
	}
	function makePattern(texBits) {
		const middle = [], top = [];
		for (let level = 0; level <= LARGEST; level++) {
			middle.push(order(texBits, level, level ? middle[level - 1] : null, MIDDLE_U, MIDDLE_V));
			top.push(order(texBits, level, level ? top[level - 1] : null, TOP_U, TOP_V));
		}
		return { middle, top };
	}
	function lattice(i, j) { return hash(mod(i, 10) * 17.3 + mod(j, 10) * 91.1); }
	function bigNoise(u, v) {
		const gu = u * 10, gv = v * 10, i = Math.floor(gu), j = Math.floor(gv);
		let fu = gu - i, fv = gv - j;
		fu = fu * fu * (3 - 2 * fu); fv = fv * fv * (3 - 2 * fv);
		const a = lattice(i, j), b = lattice(i + 1, j), c = lattice(i, j + 1), d = lattice(i + 1, j + 1);
		return (a + (b - a) * fu) * (1 - fv) + (c + (d - c) * fu) * fv;
	}
	// VanillaClouds.code: which layers a cell has, given how far its middle is from explored land.
	function code(s, u, v, k) {
		const size = CELL * Math.pow(2, k), level = Math.min(k, LARGEST), period = REPEAT >> level;
		let i = mod(u, period), j = mod(v, period);
		if (k > LARGEST) {
			const way = Math.floor(hash(Math.floor(u / period) * 12.9898 + Math.floor(v / period) * 78.233 + k * 37.719) * 8);
			if (way & 1) i = period - 1 - i;
			if (way & 2) j = period - 1 - j;
			if (way & 4) { const t = i; i = j; j = t; }
		}
		const r = size / CELL;
		const far = s + 0.6 * size * Math.min(1, 2 / r);
		const ramp = RAMP * Math.min(1, 1 / Math.sqrt(r));
		const big = bigNoise(i / period, j / period);
		let c = 0;
		if (far > 2) c |= 1;
		const toward = Math.max(0, Math.min(1, (far + ramp) / ramp));
		const middle = far > 2 ? 0.5 * (0.4 + 1.2 * big) : 0.15 + 0.55 * Math.pow(toward, 1.5);
		if (far > -ramp && pattern.middle[level][j * period + i] <= middle) c |= 2;
		const inner = Math.max(0, Math.min(1, far / (48 * Math.sqrt(r))));
		if (far > 10 && pattern.top[level][j * period + i] <= 0.4 * inner * (0.25 + 1.5 * big)) c |= 4;
		return c;
	}

	// The chamfer distance of ExportFog: thirds of a texel to the nearest zero.
	function chamfer(d, w, h) {
		for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
			const k = j * w + i; let v = d[k];
			if (i > 0) v = Math.min(v, d[k - 1] + 3);

		}
	}


	function paint(left, top, w, h, z) {
		if (off) return;
		if (!program) {
			if (!pattern && map && dim) { pattern = "loading"; setTimeout(init, 0); }
			return;
		}
		// Drawn at most at the CSS pixel size, half that on an ordinary screen, as the game draws its
		// clouds at half resolution: they're soft-edged cells about 40 pixels across.
		const dpr = devicePixelRatio || 1, res = Math.min(dpr, 2) / 2;
		const cw = Math.max(1, Math.round(w * res)), ch = Math.max(1, Math.round(h * res));
		if (glCanvas.width !== cw || glCanvas.height !== ch) { glCanvas.width = cw; glCanvas.height = ch; }
		const pixelUnits = 1 / view.scale;
		const size = Math.max(0, Math.log2(CLOUD_PIXELS * pixelUnits / CELL));
		let sizeLevel = Math.floor(size), grow = smoothstep(0.2, 0.8, size - sizeLevel);
		if (grow >= 1) { sizeLevel++; grow = 0; }
		// The region worked out lasts while the view stays inside it at the same zoom; tiles
		// arriving rebuild it now and then, not every frame.
		const inside = field && field.z === z && field.sizeLevel === sizeLevel && left >= field.rl && top >= field.rt
			&& left + w / view.scale <= field.rl + field.rw && top + h / view.scale <= field.rt + field.rh;
		if (!inside || (dirty && !fieldTimer)) {
			const now = () => { fieldTimer = 0; dirty = false; field = build(left, top, w, h, z, sizeLevel); upload(field); };
			if (!inside) now();
			else fieldTimer = setTimeout(() => { now(); draw(); }, 150);
		}
		gl.viewport(0, 0, cw, ch);
		gl.clearColor(0, 0, 0, 0);
		gl.clear(gl.COLOR_BUFFER_BIT);
		const f = field;
		gl.uniform2f(uni.origin, left, top);
		gl.uniform2f(uni.extent, w / view.scale, h / view.scale);
		gl.uniform1f(uni.pixelUnits, pixelUnits);
		gl.uniform2f(uni.fieldOrigin, f.rl, f.rt);
		gl.uniform1f(uni.fieldTexel, f.texel);
		gl.uniform2f(uni.fieldSize, f.fw, f.fh);
		gl.uniform2i(uni.codeOrigin0, f.codes[0].cu0, f.codes[0].cv0);
		gl.uniform2i(uni.codeOrigin1, f.codes[1].cu0, f.codes[1].cv0);
		gl.uniform2i(uni.codeSize0, f.codes[0].cw, f.codes[0].ch);
		gl.uniform2i(uni.codeSize1, f.codes[1].cw, f.codes[1].ch);
		gl.uniform1f(uni.size0, f.codes[0].cell);
		gl.uniform1f(uni.size1, f.codes[1].cell);
		gl.uniform1f(uni.grow, grow);
		gl.uniform1f(uni.bigShare, smoothstep(-0.6, 1, Math.log2(CLOUD_PIXELS * pixelUnits / CELL)));
		gl.uniform1f(uni.wrap, 512 * Math.pow(2, Math.max(0, sizeLevel - 2) + 1));
		gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
	}

	// Coverage stays with its picture: kept while the picture is (a dimension shown again has it),
	// dropped with it.
	function reset() { field = null; dirty = true; }
	function forget(key) { if (coverage.delete(key)) dirty = true; }
	function changed() { dirty = true; }

	return { paint, prepare, forget, reset, changed, debug: () => ({ field, coverage }) };
})();

// Panning and zooming, by mouse, wheel, touch and keys.
const pointers = new Map();
let last = null;
canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, e); canvas.classList.add("dragging"); last = gesture(); });
canvas.addEventListener("pointermove", e => {
	showWhere(e);
	if (!pointers.has(e.pointerId)) return;
	pointers.set(e.pointerId, e);
	const now = gesture();
	if (last && now && last.n === now.n) {
		if (now.n > 1) zoomAt(now.x, now.y, now.d / last.d);
		view.u -= (now.x - last.x) / view.scale;
		view.v -= (now.y - last.y) / view.scale;
		draw();
	}
	last = now;
});
for (const type of ["pointerup", "pointercancel"]) canvas.addEventListener(type, e => {
	pointers.delete(e.pointerId);
	last = gesture();
	if (!pointers.size) { canvas.classList.remove("dragging"); saveHash(); }
});
function gesture() {
	const ps = [...pointers.values()];
	if (!ps.length) return null;
	const x = ps.reduce((s, p) => s + p.clientX, 0) / ps.length, y = ps.reduce((s, p) => s + p.clientY, 0) / ps.length;
	const d = ps.length > 1 ? Math.hypot(ps[0].clientX - ps[1].clientX, ps[0].clientY - ps[1].clientY) : 1;
	return { n: ps.length, x, y, d };
}
canvas.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.pow(2, -e.deltaY / (e.deltaMode ? 3 : 300))); draw(); saveHashSoon(); }, { passive: false });
function limits() {
	const native = map ? map.tilePixels / map.tileUnits : 4;
	const coarsest = dim ? dim.zoomLevels - 1 : 0;
	return { min: native / (1 << coarsest) / 4, max: native * 4 };
}
function zoomAt(x, y, factor) {
	const lim = limits();
	const scale = Math.max(lim.min, Math.min(lim.max, view.scale * factor));
	const w = canvas.clientWidth, h = canvas.clientHeight;
	const pu = view.u + (x - w / 2) / view.scale, pv = view.v + (y - h / 2) / view.scale;
	view.scale = scale;
	view.u = pu - (x - w / 2) / scale;
	view.v = pv - (y - h / 2) / scale;
}
document.getElementById("in").onclick = () => { zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 2); draw(); saveHash(); };
document.getElementById("out").onclick = () => { zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 0.5); draw(); saveHash(); };
addEventListener("keydown", e => {
	const step = 80 / view.scale;
	const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
	if (moves[e.key]) { view.u += moves[e.key][0]; view.v += moves[e.key][1]; }
	else if (e.key === "+" || e.key === "=") zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 2);
	else if (e.key === "-") zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 0.5);
	else return;
	draw();
	saveHashSoon();
});
addEventListener("resize", draw);

// The block under the pointer. The map looks down at an angle, so a row of the picture runs over
// many places north to south; the Z shown is where it meets the ground at sea level.
function showWhere(e) {
	if (!map || e.pointerType === "touch") return;
	const u = view.u + (e.clientX - canvas.clientWidth / 2) / view.scale;
	const v = view.v + (e.clientY - canvas.clientHeight / 2) / view.scale;
	const z = (v + 64 * map.cos) / map.sin;
	const where = document.getElementById("where");
	where.hidden = false;
	where.textContent = "X " + Math.floor(u) + "   Z ~" + Math.floor(z);
}

// The view in the address, so a link opens on the same place.
function parseHash() {
	const p = new URLSearchParams(location.hash.slice(1));
	const out = { dim: p.get("dim") || undefined };
	if (p.has("u") && p.has("v")) { out.u = +p.get("u"); out.v = +p.get("v"); out.scale = +(p.get("s") || 1); }
	return out;
}
let hashTimer = 0;
function saveHashSoon() { clearTimeout(hashTimer); hashTimer = setTimeout(saveHash, 300); }
function saveHash() {
	if (!dim) return;
	history.replaceState(null, "", "#dim=" + encodeURIComponent(dim.id) + "&u=" + Math.round(view.u) + "&v=" + Math.round(view.v) + "&s=" + view.scale.toFixed(3));
}

load(true);
draw();
</script>
</body>
