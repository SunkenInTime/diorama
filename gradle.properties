org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Configure only the versions a build names (./gradlew :26.3:build) instead of all 21. Loom builds
# each Fabric version's Minecraft jars in this checkout's .gradle the first time it configures that
# version, so a new worktree used to spend about four and a half minutes on all ten before its
# first task. Unqualified build tasks (./gradlew compileJava, ./gradlew build) still configure and
# run every version; ./gradlew tasks only lists the versions it configured.
org.gradle.configureondemand=true

# Shared by every Minecraft version. Per-version settings are in versions/<version>/gradle.properties.
# check these on https://fabricmc.net/develop
loader_version=0.19.5

mod_version=0.7.0
mod_group=dev.diorama
